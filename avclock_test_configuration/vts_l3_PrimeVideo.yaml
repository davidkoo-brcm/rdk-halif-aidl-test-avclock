videosink:
  stream_download_path: "" #`URL` path to download the video test streams
  input_streams_path: "assets/streams/input" #Target path where input streams are stored
  reference_streams_path: "assets/streams/reference/" #Target path for reference decoded streams
  L3:
    PrimeVideo:
      Controls:
        delay_between_decode_calls: 0 # Insert delay in msec between each `decodeBuffer()` call
        discontinuityPTS: -1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_30p_PIXEL_FORMAT_YCBCR420_8M_10SEC
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_MAIN_3840x2160_DR_HDR10_DR_BT2020_60p_PIXEL_FORMAT_YCBCR420_12M_10SEC
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1

# Ensure PrimeVideo-selected fixed-resolution streams provide this key
# expected by videodecoder parser.
VideoStreams:
  H264_HIGH_1920x1080_DR_SDR_DR_BT709_30p_PIXEL_FORMAT_YCBCR420_8M_10SEC:
    resolution_changes: []
  H265_MAIN_3840x2160_DR_HDR10_DR_BT2020_60p_PIXEL_FORMAT_YCBCR420_12M_10SEC:
    resolution_changes: []




