IAudioDecoderManager:
  stream_download_path: "http://<>/streams" #`URL` path to download the audio test streams
  input_streams_path: "assets/streams/input" #Target path where input streams are stored
  reference_streams_path: "assets/streams/reference/" #Target path for reference PCM streams
  L3: #Test Level
    PrimeAudio: #Test Name
      Controls:
        delay_between_decode_calls: -1 # Insert delay in msec between each `decodeBuffer()` call
        stop_start_pts: -1 #`pts` value in nano seconds at which the decoder should be stopped and restarted during the test. -1 indicates that decoder should not be restarted
        signal_discontinuity_pts: -1 #`pts` value in nano seconds at which the test should signal discontinuity to the decoder. -1 indicates that no discontinuity signal should be sent
        flush_pts: -1 #`pts` value in nano seconds that determine when the test should flush the decoder. -1 indicates that test should not flush
        flush_reset_pts: -1 #`pts` value in nano seconds that determine when the test should flush with reset the decoder. -1 indicates that test should not flush
        eos_pts: -1 #`pts` value in nano seconds that determine when the test should sent `eos` signal to decoder. -1 indicates that test should not signal `eos`
        sink_eos_pts: -1
        sink_flush_pts: -1
      Inputs:
        Streams:
####### AAC Streams ##############
          - Name: tones_8k_2_64_aac #Stream name
            PTS: #List of Presentation Time Stamps (per frame) in microseconds
              - 0
              - 128000000
              - 256000000
              - 384000000
              - 512000000
              - 640000000
              - 768000000
              - 896000000
              - 1024000000
              - 1152000000
            trim: #Start and end trim points in Nano seconds
              - 0 #Start in Nano seconds
              - 0 #End
            decode_time_threshold: 100000 #Time budget per frame for decoding, in microseconds
            rms_diff_threshold: 0.5 #Maximum allowed `rms` difference for output validation
